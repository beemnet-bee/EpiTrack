
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HexaStream - Neural Node Archiver</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #06b6d4;
      --bg: #020617;
      --font-mono: 'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-mono);
      background-color: var(--bg);
      color: #e2e8f0;
      overflow-x: hidden;
      scroll-behavior: smooth;
      font-size: 13px;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.15em;
    }
    .font-mono {
      font-family: var(--font-mono);
    }
    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; filter: blur(20px); }
      50% { opacity: 0.6; filter: blur(30px); }
    }
    .glow-overlay {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(40px);
      z-index: 0;
      animation: pulse-glow 10s ease-in-out infinite;
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .scanline::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(139, 92, 246, 0.02), transparent);
      animation: scanline 12s linear infinite;
      pointer-events: none;
      z-index: 50;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 0px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Scene 3D compact */
    .scene-3d {
      perspective: 1000px;
      transform-style: preserve-3d;
    }
    .container-3d {
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.2, 0, 0.2, 1);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "three": "https://esm.sh/three@0.174.0"
  }
}
</script>
</head>
<body>
  <div id="root" class="scanline"></div>
</body>
</html>
